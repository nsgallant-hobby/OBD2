<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script type="module" src="./js/HtmlControls.js"></script>
    <hr>
    <button id = connectbutton>Connect to Bluetooth Device</button>
    <div id="connection-card">
        <h3>Scanner Status</h3>
        <p>Device: <span id="device-name">Not Connected</span></p>
        <p>Status: <span id="connection-status" style="color: red;">● Disconnected</span></p>
    </div>
    <hr>
    <button id = LoadPidList>Load PID List</button>
    <hr>
    <div id="pid-list-container">
    <p>Loading PID library...</p>
    </div>
    
</body>
</html>
